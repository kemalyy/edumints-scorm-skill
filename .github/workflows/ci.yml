name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON templates/examples + skill structure
        run: |
          python - <<'PY'
          import json, sys, pathlib
          root = pathlib.Path("authoring-scorm-courses")
          assert (root / "SKILL.md").exists(), "SKILL.md missing"
          bad = []
          for p in root.rglob("*.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("Invalid JSON:"); [print(" -", b) for b in bad]; sys.exit(1)
          print("OK: SKILL.md present and all JSON valid")
          PY
      - name: README tree vs real directory (D4 — drift gate)
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # README'deki Structure ağacında listelenen references/*.md adları
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          tree = re.search(r"## Structure.*?```(.*?)```", readme, re.S)
          assert tree, "README'de Structure kod bloğu yok"
          listed = set(re.findall(r"([\w\-]+\.md)", tree.group(1))) - {"SKILL.md"}
          # Gerçek dizin
          real = {p.name for p in pathlib.Path("authoring-scorm-courses/references").glob("*.md")}
          missing = sorted(real - listed)   # dizinde var, README'de yok
          stale = sorted(listed - real)     # README'de var, dizinde yok
          if missing or stale:
              if missing: print("README ağacında EKSİK:", *(" - "+m for m in missing), sep="\n")
              if stale: print("README ağacında BAYAT (dizinde yok):", *(" - "+s for s in stale), sep="\n")
              sys.exit(1)
          print(f"OK: README tree == references/ ({len(real)} dosya)")
          PY
